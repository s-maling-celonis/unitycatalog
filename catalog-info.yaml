apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: unity-catalog
  title: Unity Catalog
  description: Unity Catalog backend server — REST API for catalog metadata, deployed as a container and published as a Maven artifact.
  tags:
    - java
    - celospark
    - unitycatalog
  annotations:
    github.com/project-slug: celonis/unitycatalog
    backstage.io/techdocs-ref: dir:.
    sonarqube.org/project-key: celonis_unitycatalog
    repo-depot.celonis.dev/project-type: JAVA_MAVEN_CUSTOM
    repo-depot.celonis.dev/image-name: celospark/unitycatalog
    repo-depot.celonis.dev/dply-release-approval-team: Storium
    repo-depot.celonis.dev/workflow-runner-release: runner=2cpu-linux-x64
    # Uncomment when deployed via cfg-ibc / ArgoCD:
    # argocd/app-selector: app=unity-catalog
    # cd.celonis.dev/cfg-ibc-folder: unity-catalog
spec:
  type: service
  lifecycle: experimental
  owner: group:default/storium
  tier: "2"

