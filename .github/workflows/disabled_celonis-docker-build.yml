# Disabled: Server Docker build and push are handled by Repo Depot.
# Re-enable: rename to celonis-docker-build.yml, restore on: triggers, remove if: false from jobs.

name: (Celonis) Build and Push Docker Images - unitycatalog-server

on:
  workflow_dispatch:

jobs:
  build:
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4.1.2
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
