# Forwards Unity Catalog publishes to celonis/celospark so it can upsert the
# matching pin PR (DEV or RC). Do not add this to generated RepoDepot files.
#
# DEV: RepoDepot Finalize Dev Build POSTs repository_dispatch
# repodepot_dev_build_complete with build_name + service_name. Filter to
# unitycatalog-spark so one CeloSpark DEV PR is opened per build.
#
# RC: that event is DEV-only. Forward RCs with workflow_dispatch using an
# *_RCnn tag; CeloSpark routes it to chore/bump-unity-catalog-rc.
name: Notify CeloSpark of Unity Catalog pin

on:
  repository_dispatch:
    types: [repodepot_dev_build_complete]

  workflow_dispatch:
    inputs:
      uc_version:
        description: RepoDepot tag (dev_… or …_RCnn)
        required: true
        type: string
      build_url:
        description: Optional Actions run URL for the PR body
        required: false
        type: string

permissions:
  contents: read

jobs:
  forward-dev:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.service_name == 'unitycatalog-spark'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CeloSpark DEV bump
        env:
          GH_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
          UC_VERSION: ${{ github.event.client_payload.build_name }}
          ORIGIN_RUN: ${{ github.event.client_payload.origin_run_id }}
        run: |
          set -euo pipefail
          test -n "${UC_VERSION}"
          BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${ORIGIN_RUN}"
          gh api --method POST /repos/celonis/celospark/dispatches --input - <<EOF
          {
            "event_type": "unitycatalog-published",
            "client_payload": {
              "uc_version": "${UC_VERSION}",
              "build_url": "${BUILD_URL}"
            }
          }
          EOF

  forward-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CeloSpark bump (lane from tag)
        env:
          GH_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
          UC_VERSION: ${{ inputs.uc_version }}
          BUILD_URL: ${{ inputs.build_url }}
        run: |
          set -euo pipefail
          test -n "${UC_VERSION}"
          gh api --method POST /repos/celonis/celospark/dispatches --input - <<EOF
          {
            "event_type": "unitycatalog-published",
            "client_payload": {
              "uc_version": "${UC_VERSION}",
              "build_url": "${BUILD_URL}"
            }
          }
          EOF
