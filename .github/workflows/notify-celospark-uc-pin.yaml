# Forwards Unity Catalog publishes to celonis/celospark so it can upsert the
# matching pin file on main (uc.version.dev or uc.version.rc). Do not add this
# to generated RepoDepot files.
#
# Body always includes lane (dev|rc) plus uc_version. CeloSpark keys the pin
# file off lane, not off tag spelling.
#
# DEV: RepoDepot Finalize Dev Build POSTs repository_dispatch
# repodepot_dev_build_complete with build_name + service_name. Filter to
# unitycatalog-spark so one CeloSpark DEV PR is opened per build.
#
# RC: that event is DEV-only, and RepoDepot's ref pushes do not trigger
# workflows, so neither the release branch nor the RC tag can be the trigger.
# Watch the RC workflow itself instead and read the version off the
# <timestamp>_RCnn_<service> tag RepoDepot leaves on the run's head commit.
#
# workflow_run.workflows is required (GitHub 422s the file without it) and
# matches the run's stored name, which is the evaluated run-name when the
# workflow sets one (actions/runner#4141). RepoDepot's RC workflow always
# sets one, so NEW is "Create RC from NEW branch" and EXISTING is
# "Create RC from EXISTING branch" (plus ` \`<ref>\`` when a branch is
# supplied). List both, and the static workflow name in case GitHub
# matches that instead. forward-rc then accepts either run-name.
#
# workflow_dispatch stays as the manual escape hatch for either lane.
name: Notify CeloSpark of Unity Catalog pin

on:
  repository_dispatch:
    types: [repodepot_dev_build_complete]

  workflow_run:
    workflows:
      - '[RepoDepot] Create Release Candidate'
      - 'Create RC from NEW branch'
      - 'Create RC from EXISTING branch'
    types: [completed]

  workflow_dispatch:
    inputs:
      lane:
        description: CeloSpark pin to update
        required: true
        type: choice
        options:
          - dev
          - rc
      uc_version:
        description: RepoDepot tag (dev_… for DEV, …_RCnn for RC)
        required: true
        type: string
      build_url:
        description: Optional Actions run URL for the PR body
        required: false
        type: string

permissions:
  contents: read

jobs:
  forward-dev:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.service_name == 'unitycatalog-spark'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CeloSpark DEV bump
        env:
          GH_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
          UC_VERSION: ${{ github.event.client_payload.build_name }}
          ORIGIN_RUN: ${{ github.event.client_payload.origin_run_id }}
        run: |
          set -euo pipefail
          test -n "${UC_VERSION}"
          if [[ "${UC_VERSION}" != dev_* ]]; then
            echo "expected a dev_* tag for DEV forward, got ${UC_VERSION}" >&2
            exit 1
          fi
          BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${ORIGIN_RUN}"
          gh api --method POST /repos/celonis/celospark/dispatches --input - <<EOF
          {
            "event_type": "unitycatalog-published",
            "client_payload": {
              "lane": "dev",
              "uc_version": "${UC_VERSION}",
              "build_url": "${BUILD_URL}"
            }
          }
          EOF

  forward-rc:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.path == '.github/workflows/repodepot-create-release-candidate.yaml' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve RC tag
        id: tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # An RC can cover any subset of services. No unitycatalog-spark tag on
          # this commit means the RC did not include the jars CeloSpark pins.
          tag=""
          for _ in $(seq 1 10); do
            tag="$(git tag --points-at "${HEAD_SHA}" \
              | grep -E '_RC[0-9]{2}_unitycatalog-spark$' | sort | tail -n1 || true)"
            if [[ -n "${tag}" ]]; then
              break
            fi
            sleep 15
            git fetch --tags --quiet
          done
          if [[ -z "${tag}" ]]; then
            echo "no unitycatalog-spark RC tag on ${HEAD_SHA}; nothing to forward"
            exit 0
          fi
          echo "uc_version=${tag%_unitycatalog-spark}" >> "${GITHUB_OUTPUT}"

      - name: Dispatch CeloSpark RC bump
        if: steps.tag.outputs.uc_version != ''
        env:
          GH_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
          UC_VERSION: ${{ steps.tag.outputs.uc_version }}
          BUILD_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          gh api --method POST /repos/celonis/celospark/dispatches --input - <<EOF
          {
            "event_type": "unitycatalog-published",
            "client_payload": {
              "lane": "rc",
              "uc_version": "${UC_VERSION}",
              "build_url": "${BUILD_URL}"
            }
          }
          EOF

  forward-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CeloSpark bump
        env:
          GH_TOKEN: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
          LANE: ${{ inputs.lane }}
          UC_VERSION: ${{ inputs.uc_version }}
          BUILD_URL: ${{ inputs.build_url }}
        run: |
          set -euo pipefail
          test -n "${UC_VERSION}"
          case "${LANE}" in
            dev)
              [[ "${UC_VERSION}" == dev_* ]] || {
                echo "lane=dev requires a dev_* tag, got ${UC_VERSION}" >&2
                exit 1
              }
              ;;
            rc)
              [[ "${UC_VERSION}" =~ _RC[0-9]{2}$ ]] || {
                echo "lane=rc requires an *_RCnn tag, got ${UC_VERSION}" >&2
                exit 1
              }
              ;;
            *)
              echo "lane must be dev or rc, got ${LANE}" >&2
              exit 1
              ;;
          esac
          gh api --method POST /repos/celonis/celospark/dispatches --input - <<EOF
          {
            "event_type": "unitycatalog-published",
            "client_payload": {
              "lane": "${LANE}",
              "uc_version": "${UC_VERSION}",
              "build_url": "${BUILD_URL}"
            }
          }
          EOF
