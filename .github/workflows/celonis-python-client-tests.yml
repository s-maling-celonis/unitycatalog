name: (Celonis) Python Client Tests

on:
  push:
    branches: [ "main", "develop", "branch-*" ]
  pull_request:
    branches: [ "main", "develop", "branch-*" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Branch
      uses: actions/checkout@v4.1.2
      with:
        ref: ${{ github.ref }}
        token: ${{ secrets.CELOBOT_GITHUB_TOKEN }}
    - name: Set up JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install uv
      run: bash dev/install-uv.sh

    - name: Install Python 3.9 via uv
      run: uv python install 3.9

    - name: Generate the client library, install it, and run the tests
      run: ./clients/python/run-tests.sh
