name: (Celonis) Dependency Lock Check

# sbt.lock files were removed with the Maven conversion. Cycode should read
# Maven POMs / lockfiles instead of sbt dependencyLock.
#
# Pinned to the default Spark version from project/spark-versions.json.

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  dependency-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4.1.2
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check dependency locks are up to date
        run: |
          echo "sbt dependencyLockCheck is not used after the Maven conversion."
