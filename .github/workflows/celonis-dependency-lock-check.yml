name: (Celonis) Dependency Lock Check

# Fails when the committed *.sbt.lock files no longer match the dependencies
# resolved from build.sbt. Those locks are what Cycode's SCA scan reads to see
# transitive dependencies (CBE-56140), so stale locks mean a stale vulnerability
# picture. Regenerate with `build/sbt dependencyLockWrite` and commit the result.
#
# Pinned to the default Spark version from project/spark-versions.json: the
# connectors/spark dependency graph varies with -DsparkVersion, and a single lock
# can only describe one variant.

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  dependency-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4.1.2
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check dependency locks are up to date
        run: |
          build/sbt dependencyLockCheck
