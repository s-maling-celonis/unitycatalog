name: (Celonis) Code Format Check

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4.1.2
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

      - name: Set up node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18'

      - name: Run lint check
        run: |
          (cd ui && yarn install --frozen-lockfile && yarn test:format)

  java-fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4.1.2
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Java format check
        run: |
          build/sbt javafmtCheck
