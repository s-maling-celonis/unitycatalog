name: (Celonis) Build and Push Docker Images - unitycatalog-server

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch: {}

env:
  IMAGES: |
    ghcr.io/celonis/celospark/unitycatalog-server
    652406827250.dkr.ecr.eu-central-1.amazonaws.com/celospark/unitycatalog-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4.1.2
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Metadata and Tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGES }}
          tags: |
            type=sha,format=long,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag

      - name: GitHub Container Registry Login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: celobot
          password: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1.7.0

      - name: Build and Push Docker Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker Image (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Logout of Amazon ECR
        if: always() && github.event_name != 'pull_request'
        run: docker logout ${{ steps.login-ecr.outputs.registry }}

      - name: Generate and attest provenance
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: celonis/sigstore-container-signing-action@master
        with:
          image-registry: 652406827250.dkr.ecr.eu-central-1.amazonaws.com
          image-name: celonis/unitycatalog-server
          image-tag: ${{ steps.meta.outputs.tags }}
