name: (Celonis) Build and Push Docker Images - unitycatalog

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - build/**
      - project/**
      - examples/**
      - server/**
      - api/**
      - clients/python/**
      - version.sbt
      - build.sbt
  workflow_dispatch: {}


env:
  IMAGES: |
    ghcr.io/celonis/celospark/unitycatalog
    652406827250.dkr.ecr.eu-central-1.amazonaws.com/celospark/unitycatalog

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4.1.2
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

        # Required for multi-arch builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

        # Will generate tags for the image
        # For ref/tags/*: latest, <tag>
        # For refs/heads/main: main, main-<short-sha>
      - name: Generate Metadata and Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGES }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,enable=${{ github.ref == 'refs/heads/main' }},prefix={{branch}}-

      - name: GitHub Container Registry Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: celobot
          password: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1.7.0

      - name: Build and Push Docker Image
        if: ${{ contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name) && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          # Push only tagged releases to registry. Eg. the git ref
          # "refs/tags/v0.2.0" would result the tagged image
          # "unitycatalog/unitycatalog:v0.2.0".
          # See here for more info: https://tinyurl.com/yh8252m2
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # Use github actions cache: https://docs.docker.com/build/cache/backends/gha/
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Logout of Amazon ECR
        if: ${{ always() }}
        run: docker logout ${{ steps.login-ecr.outputs.registry }}

      - name: Generate and attest provenance
        uses: celonis/sigstore-container-signing-action@master
        with:
          image-registry: 652406827250.dkr.ecr.eu-central-1.amazonaws.com
          image-name: celonis/unitycatalog
          image-tag: ${{ steps.meta.outputs.tags }}