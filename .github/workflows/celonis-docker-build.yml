name: (Celonis) Build and Push Docker Images - unitycatalog-server

# Image build and push on develop/release branches are handled by Repo Depot.
# This workflow validates the server Docker build on pull requests to develop only.
on:
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4.1.2
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.CELOBOT_GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
