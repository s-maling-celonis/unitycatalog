name: Run UC JaCoCo tests
description: >-
  Restore the shared UC build cache and run Maven verify (including JaCoCo) for
  one reactor module. The calling job must run actions/checkout first.

inputs:
  maven-pl:
    description: Maven -pl module path, e.g. "server" or "connectors/hadoop".
    required: true
  spark-version:
    description: Optional Spark version (-DsparkVersion) for connector tests.
    required: false
    default: ''
  delta-version:
    description: Optional Delta version (-DdeltaVersion) for connector tests.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Restore UC build cache
      uses: ./.github/actions/restore-uc-build-cache

    - name: Run tests with coverage
      shell: bash
      run: |
        SPARK_ARGS=""
        if [[ -n "${{ inputs.spark-version }}" ]]; then
          SPARK_ARGS="-DsparkVersion=${{ inputs.spark-version }}"
        fi
        if [[ -n "${{ inputs.delta-version }}" ]]; then
          SPARK_ARGS="$SPARK_ARGS -DdeltaVersion=${{ inputs.delta-version }}"
        fi
        mvn -B $SPARK_ARGS -pl ${{ inputs.maven-pl }} verify
