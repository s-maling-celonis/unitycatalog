name: Restore UC build cache
description: >-
  Restore the UC build cache produced by publish-uc-build for this workflow run.
  The calling job must run actions/checkout first.

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'maven'

    - name: Restore UC build cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.m2/repository/io/unitycatalog
          server/target
          server-shaded/target
          clients/java/target
          connectors/hadoop/target
          connectors/spark/target
          integration-tests/target
          control-api/target
        key: uc-build-${{ github.run_id }}
        fail-on-cache-miss: true
